# die-core's planted bugs, run by `cargo xtask mutate` (from spike S4's mutate.sh).
# Each replaces `old` (which must occur exactly once in `file`, relative to
# crates/die-core) with `new`, and the property tests in tests/prop.rs must fail.
# K2 and K4 add their own: an undo bug, a stale layout cache and a wrap bug.

[[mutant]]
name = "M1 layout cache key ignores decorations"
file = "src/layout.rs"
old = '''
let key = (self.rev(), self.deco_gen, self.settings.tab_width);'''
new = '''
let key = (self.rev(), 0, self.settings.tab_width);'''

[[mutant]]
name = "M2 hide merge ignores the replacement preference"
file = "src/layout.rs"
old = '''
v.sort_by_key(|s| (s.start, s.repl.is_none(), std::cmp::Reverse(s.end), s.deco));'''
new = '''
v.sort_by_key(|s| (s.start, std::cmp::Reverse(s.end), s.deco));'''

