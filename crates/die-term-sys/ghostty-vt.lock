# die-term-sys's engine lock: where each vendored archive came from, and what it must be.
# `cargo xtask ghostty verify` checks the archives, their symbols and the bindings against it
# (in `ci` and `clean-build`); `cargo xtask ghostty bump` writes it, with a section per
# target (docs/records/die-term-engine.md §5). Spike S2 wrote this one by hand on 2026-10-19.

