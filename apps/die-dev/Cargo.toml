[package]
name = "die-dev"
description = "Your DIE config while DIE is being built"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "die"
path = "src/main.rs"

[dependencies]
die.workspace = true
# Your emacs-orchid-client's port, as init.el loads emacs-orchid-client (scope D14).
die-orchid-client.workspace = true
# The whiteboard: freehand, shapes and arrows, saved as SVG, exported as PNG (scope D14).
die-whiteboard.workspace = true

[dev-dependencies]
die-test-cap.workspace = true

# A PTY's program starts through the test binary's own trampoline (`die::other_mode`), which
# `main` has to call first, so this test has no harness.
[[test]]
name = "terminal"
harness = false

[lints]
workspace = true
