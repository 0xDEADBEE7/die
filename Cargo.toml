[workspace]
resolver = "3"
members = [
    "crates/die-core",
    "crates/die-render",
    "crates/die-vim",
    "crates/die-term-sys",
    "crates/die-term",
    "crates/die",
    "apps/die-dev",
    "extensions/die-orchid-client",
    "extensions/die-whiteboard",
    "tools/evil-oracle",
    "tools/test-cap",
    "xtask",
]
default-members = [
    "crates/die-core",
    "crates/die-render",
    "crates/die-vim",
    "crates/die-term-sys",
    "crates/die-term",
    "crates/die",
    "apps/die-dev",
    "extensions/die-orchid-client",
    "extensions/die-whiteboard",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

# Every dependency is pinned to an exact version (`cargo xtask lint` checks).
[workspace.dependencies]
die-core = { path = "crates/die-core" }
die-render = { path = "crates/die-render" }
die-vim = { path = "crates/die-vim" }
die-term = { path = "crates/die-term" }
die = { path = "crates/die" }
# Your packages' ports, built here under extensions/, outside the product and its budget (scope D14).
die-orchid-client = { path = "extensions/die-orchid-client" }
die-whiteboard = { path = "extensions/die-whiteboard" }
evil-oracle = { path = "tools/evil-oracle" }
die-test-cap = { path = "tools/test-cap" }

ropey = { version = "=1.6.1", default-features = false, features = ["simd"] }
slotmap = "=1.1.1"
unicode-width = { version = "=0.2.2", default-features = false }
unicode-segmentation = "=1.13.3"
# regex's engine, for searches bounded at the cursor (D4). These are the features regex
# turns on with "std", "perf" and "unicode".
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "meta", "nfa-backtrack", "hybrid", "dfa-onepass", "perf", "unicode"] }
regex-syntax = { version = "=0.8.11", default-features = false }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
# Local time for die-orchid-client's stubs, from the system's zoneinfo (no bundled database).
jiff = { version = "=0.2.41", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# The terminal engine's Rust API, pinned at the rev crates/die-term-sys/ghostty-vt.lock names,
# without its PNG decoder (D10, docs/records/s2-term-engine.md). Its sys crate is die-term-sys,
# through the `[patch]` below.
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "d2036baeb605d31d09a9e2ba6d0c923e04c34d54", default-features = false, features = ["kitty-graphics"] }
# die-whiteboard's rasterizer, PNG encoder and the exporter's font reader: pure Rust, no build
# scripts, behind the extension's canvas.rs and fonts.rs (scope §9's rule of two for a shared crate).
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
png = "=0.18.1"
fontdue = { version = "=0.9.5", default-features = false, features = ["std"] }
# PTYs and their processes, safely (die-core's `pty`). Pure Rust: libc on macOS, syscalls on Linux.
rustix = { version = "=1.1.5", default-features = false, features = ["std", "event", "fs", "pipe", "process", "pty", "termios"] }

# unsafe is forbidden everywhere except die-render's platform module, die-term-sys's
# FFI module and die-test-cap's allocator, which is never linked into DIE. Those three
# crates set their own lints (scope §12; `cargo xtask lint` checks).
[workspace.lints.rust]
unsafe_code = "forbid"

# libghostty-rs's sys crate builds the engine with Zig; DIE's links the signed archive instead (D16, D17).
[patch."https://github.com/uzaaft/libghostty-rs"]
libghostty-vt-sys = { path = "crates/die-term-sys" }

[profile.release]
debug = "line-tables-only"

# The property tests run thousands of cases; unoptimized ropes make them slow.
[profile.test]
opt-level = 1
# Enough for a panic's backtrace. A cold workspace test build takes about 15% less CPU than with
# full debug info, a rebuild about 20% less, and the cache is about 20% smaller.
debug = "line-tables-only"
