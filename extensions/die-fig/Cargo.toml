[package]
name = "die-fig"
description = "Figures from data in a DIE buffer: charts, network graphs and dashboards drawn in pixels, in the ethos of fig (scope D14)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# An extension, outside the product: it depends on die-core and die-draw only (`cargo xtask lint`
# checks). tiny-skia stays behind raster.rs, die-draw's type behind raster.rs and its measure, and
# jiff behind data/time.rs and scale/. Specs and data go through json.rs, never serde; serde_json
# only builds what the session keeps.
[dependencies]
die-core.workspace = true
die-draw.workspace = true
tiny-skia.workspace = true
jiff.workspace = true
serde_json.workspace = true

[dev-dependencies]
die-test-cap.workspace = true
die-vim.workspace = true

[lints]
workspace = true
