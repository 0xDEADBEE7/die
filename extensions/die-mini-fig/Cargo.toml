[package]
name = "die-mini-fig"
description = "A spike of die-fig at about a tenth of its size: the same .fig specs drawn by one host, to feel what is lost (scope D14)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# An extension, outside the product: it depends on die-core and die-draw only (`cargo xtask lint`
# checks), never on die-fig. Specs go through serde into its own types; jiff reads and writes
# times in the local zone.
[dependencies]
die-core.workspace = true
die-draw.workspace = true
tiny-skia.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
die-test-cap.workspace = true

[lints]
workspace = true
