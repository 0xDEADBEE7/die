# die-render's modules at M0 (docs/records/platforms.md §5.7). The neutral code
# (R2's atlas, row cache, instance building and driver, then the window, loop and
# input: R3 and R4) goes here as it lands. Linux's modules, `platform::linux` and
# the portable backend (`backend::wgpu`, `text::fontations`), join with their code,
# and replace the stub.

[[module]]
crate = "die-render"
name = "neutral"
limit = 2300
files = ["lib.rs", "platform/mod.rs", "atlas.rs", "driver.rs", "font.rs", "frame.rs", "rows.rs", "input.rs", "sprite.rs", "window.rs", "latency.rs"]

# `die --check`: the window's own checks, which ship in the binary. R3's are about 420
# lines, and R6 adds `typing` and `firstframe`.
[[module]]
crate = "die-render"
name = "checks"
limit = 700
files = ["check.rs"]

# 900 is the size the `unsafe` review was planned for (docs/m0-plan.md §3).
# Raising it is when the thin-wrapper question gets asked. R6 raised it to 950 for the
# presented handler, a key's own timestamp and posting a key to this process, each a
# thin wrapper. R4's review raised it to 1,060 for the hook on winit's view that keeps the
# Character Viewer's text, which winit drops, and that isn't a thin wrapper of anything.
[[module]]
crate = "die-render"
name = "platform::macos"
platforms = ["macos"]
limit = 1060
files = ["platform/macos/"]

# Every item the frame driver names needs one here, so this grows with it. R2 took it
# from 3 lines to 64, R3 to 105, R5 to 112, R6 to 151, and R4's review to 157.
[[module]]
crate = "die-render"
name = "platform stub"
platforms = ["linux"]
limit = 160
files = ["platform/backend.rs"]
