# Guard 7's budgets (scope §3), checked by `cargo xtask budget`.
#
# Counting rule: code lines after rustfmt, without blank lines, comments (doc
# comments included), `tests/` directories or `#[cfg(test)]` items, counted by
# xtask's own counter under the pinned toolchain.
#
# Module limits are ratchets (docs/m0-plan.md §4). Each starts at the top of its
# module's M0 estimate and drops to the measured size after M0. Every file in a
# crate that has modules must belong to exactly one of them.
#
# A crate whose code differs by platform lists its `builds`. Each of its modules
# is neutral, in every build, or has `platforms`: the builds it's in. A build is
# the neutral modules plus its platform's, and `build_limit` caps each one;
# `limit` caps the crate's total (docs/records/platforms.md §5.7).

[[crate]]
name = "die-core"
path = "crates/die-core"
limit = 14000

[[crate]]
name = "die-render"
path = "crates/die-render"
limit = 7000
builds = ["macos", "linux"]
build_limit = 5000
note = "guard 7: 5k per build, 7k in total"

[[crate]]
name = "die-vim"
path = "crates/die-vim"
limit = 5000
note = "guard 7, since 2026-10-19"

[[crate]]
name = "die"
path = "crates/die"

[[crate]]
name = "die-dev"
path = "apps/die-dev"

[[crate]]
name = "xtask"
path = "xtask"
dev = true

[[crate]]
name = "evil-oracle"
path = "tools/evil-oracle"
dev = true

# die-core's modules at M0. `ext.rs` holds S4's buffers and windows until K6
# moves them, and `prompt.rs` S4's prompt until K11a rebuilds it.

[[module]]
crate = "die-core"
name = "text and undo"
limit = 1250
files = ["text.rs", "undo.rs", "text/", "undo/"]

[[module]]
crate = "die-core"
name = "layout"
limit = 950
files = ["layout.rs", "layout/"]

[[module]]
crate = "die-core"
name = "keys, keymaps, describe"
limit = 650
files = ["keys.rs", "keymap.rs", "describe.rs"]

[[module]]
crate = "die-core"
name = "ext, dispatch, rt"
limit = 1500
files = ["ext.rs", "dispatch.rs", "rt.rs", "ext/", "dispatch/", "rt/"]

[[module]]
crate = "die-core"
name = "workspace, windows, pointer"
limit = 1100
files = ["workspace.rs", "windows.rs", "pointer.rs", "workspace/"]

[[module]]
crate = "die-core"
name = "files"
limit = 650
files = ["files.rs", "files/"]

[[module]]
crate = "die-core"
name = "command line, prompt, core commands"
limit = 1300
files = ["cmdline.rs", "prompt.rs", "commands.rs", "cmdline/", "prompt/", "commands/"]

[[module]]
crate = "die-core"
name = "faces and scene"
limit = 950
files = ["render.rs", "faces.rs", "scene.rs", "scene/"]

[[module]]
crate = "die-core"
name = "session"
limit = 1000
files = ["session.rs", "session/"]

[[module]]
crate = "die-core"
name = "harness, app interface, messages, ids, errors"
limit = 800
files = ["lib.rs", "ids.rs", "error.rs", "harness.rs", "app.rs", "messages.rs"]

# die-render's modules at M0 (docs/records/platforms.md §5.7). The neutral code
# (the atlas, row cache, instance building, window, loop and input: R2-R4) goes
# here as it lands. Linux's modules, `platform::linux` and the portable backend
# (`backend::wgpu`, `text::fontations`), join with their code, and replace the
# stub.

[[module]]
crate = "die-render"
name = "neutral"
limit = 2300
files = ["lib.rs", "platform/mod.rs"]

# 900 is the size the `unsafe` review was planned for (docs/m0-plan.md §3).
# Raising it is when the thin-wrapper question gets asked.
[[module]]
crate = "die-render"
name = "platform::macos"
platforms = ["macos"]
limit = 900
files = ["platform/macos/"]

[[module]]
crate = "die-render"
name = "platform stub"
platforms = ["linux"]
limit = 50
files = ["platform/backend.rs"]
