# 8,810 until X1: `:w path`, `:saveas`, `:f` and `C-g`, and `:ls`.
# 8,876 until `:` listed commands as M-x does, from a table of ex names with Vim's short forms.
# 8,912 until the macro work: `:norm`, `:g`, `:v`, `:reg`, `recording @a`, and what `.` repeats after.
# 9,340 until the macro review: a prompt a `:norm` line leaves open is answered, `2@:` runs in turn, and a count before `:`.
