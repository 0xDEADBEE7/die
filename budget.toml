# die-render's modules at M0 (docs/records/platforms.md §5.7). The neutral code
# (R2's atlas, row cache, instance building and driver, then the window, loop and
# input: R3 and R4) goes here as it lands. Linux's modules, `platform::linux` and
# the portable backend (`backend::wgpu`, `text::fontations`), join with their code,
# and replace the stub.

[[module]]
crate = "die-render"
name = "neutral"
limit = 2300
files = ["lib.rs", "platform/mod.rs", "atlas.rs", "driver.rs", "font.rs", "frame.rs", "rows.rs", "sprite.rs", "window.rs"]

# `die --check`: the window's own checks, which ship in the binary. R3's are about 420
# lines, and R6 adds `typing` and `firstframe`.
[[module]]
crate = "die-render"
name = "checks"
limit = 700
files = ["check.rs"]

# 900 is the size the `unsafe` review was planned for (docs/m0-plan.md §3).
# Raising it is when the thin-wrapper question gets asked.
[[module]]
crate = "die-render"
name = "platform::macos"
platforms = ["macos"]
limit = 900
files = ["platform/macos/"]

# Every item the frame driver names needs one here, so this grows with it. R2 took it
# from 3 lines to 64, R3 to 105, and R5 to 112.
[[module]]
crate = "die-render"
name = "platform stub"
platforms = ["linux"]
limit = 115
files = ["platform/backend.rs"]
